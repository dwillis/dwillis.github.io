{% extends "base.html" %}
{% block title %}{{ site.title }}{% endblock %}
{% block content %}
<main class="site-main px-4 py-3" data-pagefind-body>
  {{ page.html|safe }}
  <div class="row row-cols-1 row-cols-md-3 g-3 mt-2">
    {% for post in posts %}
    <div class="col"><div class="card h-100"><div class="card-body">
      <h3 class="h5 card-title"><a href="{{ post.url }}">{{ post.title }}</a></h3>
      {% if post.excerpt %}<p class="card-text text-muted small mb-1">{{ post.excerpt|truncatewords:25 }}</p>{% endif %}
      <p class="card-text"><small class="text-muted">{{ post.date|date:"n/j/y" }}</small></p>
    </div></div></div>
    {% endfor %}
  </div>
</main>
{% endblock %}
