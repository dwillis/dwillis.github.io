<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% if page.title and page.title != site.title %}{{ page.title }} – {% endif %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{% firstof page.description site.description %}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/blog.xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/code.css">
  <link rel="stylesheet" href="/pagefind/pagefind-ui.css">
  <style>
    .site-main img { max-width: 100%; height: auto; }
    .site-main pre { padding: .75rem 1rem; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: .25rem; overflow-x: auto; }
    .site-main .highlight { background: #f8f9fa; }
    .site-main pre code { background: none; padding: 0; color: inherit; }
    .site-main table { margin-bottom: 1rem; }
    .site-main table:not([class]) { width: auto; border-collapse: collapse; }
    .site-main table:not([class]) th, .site-main table:not([class]) td { border: 1px solid #dee2e6; padding: .25rem .5rem; }
    .title-banner { background: #f4f6f7; border-bottom: 1px solid #dee2e6; }
    .post-meta dt { font-size: .8rem; text-transform: uppercase; color: #6c757d; font-weight: 400; }
    .post-meta dd { margin-bottom: .5rem; }
    .sidebar .nav-link { padding: .25rem 0; }
    .sidebar .nav-link.active { font-weight: 700; }
    .toc { font-size: .9rem; }
    .toc ul { list-style: none; padding-left: .75rem; }
    .toc > ul { padding-left: 0; }
    #search { min-width: 12rem; position: relative; --pagefind-ui-scale: .8; --pagefind-ui-font: inherit; }
    #search .pagefind-ui__drawer { position: absolute; right: 0; z-index: 1050; width: min(34rem, 92vw); background: #fff; padding: 1rem; border: 1px solid #dee2e6; box-shadow: 0 .5rem 1rem rgba(0,0,0,.15); }
    .listing-item { border-bottom: 1px solid #eee; padding: 1rem 0; }
    .listing-item h3 { font-size: 1.25rem; margin: 0 0 .25rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="/images/dwillis.png" alt="" width="32" height="32" class="me-2 rounded-circle">{{ site.title }}
      </a>
      <div class="d-flex align-items-center ms-auto gap-3">
        <a class="text-white-50" href="/blog.xml" aria-label="feed"><i class="bi bi-rss"></i></a>
        <div id="search"></div>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 sidebar py-3 border-end">
        <div class="mb-3">
          {% for icon, label, href in social %}<a class="px-1 text-body" href="{{ href }}" aria-label="{{ label }}"><i class="bi bi-{{ icon }}"></i></a>{% endfor %}
        </div>
        <ul class="nav flex-column">
          {% for item in nav %}
          <li class="nav-item"><a class="nav-link{% if item.active %} active{% endif %}" href="{{ item.href }}">{{ item.text }}</a></li>
          {% endfor %}
        </ul>
      </aside>
      <div class="col-md-9 col-lg-10 px-0">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <footer class="border-top py-3 mt-4 text-center text-muted small">© Copyright {{ year }} Derek Willis.</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    if (window.PagefindUI) new PagefindUI({ element: "#search", showImages: false, showSubResults: false, resetStyles: false });
  </script>
</body>
</html>
